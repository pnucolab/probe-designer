services:
  redis:
    image: redis:7
    container_name: probe-designer-redis
    networks:
      - internal_net
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: probe-designer-api
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - redis
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./gene_sequences:/app/gene_sequences
      - ./probe_sequences:/app/probe_sequences
    networks:
      - internal_net
    command: uvicorn backend.main_app:app --host 0.0.0.0 --port 8002 --reload
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: probe-designer-worker
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - redis
      - api
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./gene_sequences:/app/gene_sequences
      - ./probe_sequences:/app/probe_sequences
    networks:
      - internal_net
    command: celery -A backend.celery_worker worker --loglevel=info
    shm_size: '2gb'
    # GPU access for the aligner + k-mer counting. Requires nvidia-container-toolkit
    # on the host. Without this block the worker cannot see the GPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Explicit device entries are needed in addition to the `deploy` block above
    # on hosts where the NVIDIA container runtime cannot program the device
    # cgroup itself (for example when running with no-cgroups = true). On those
    # hosts the runtime hook bind-mounts the driver but grants no access to the
    # device nodes, and these entries are what make Docker emit the cgroup allow
    # rules. Keep them alongside the `deploy` block, not instead of it.
    #
    # Set NVIDIA_DEVICE in a local .env file to match the GPU node your host
    # exposes (e.g. NVIDIA_DEVICE=/dev/nvidia3); it defaults to /dev/nvidia0.
    # Add one extra entry per additional GPU you want the worker to see.
    devices:
      - ${NVIDIA_DEVICE:-/dev/nvidia0}:${NVIDIA_DEVICE:-/dev/nvidia0}
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: probe-designer-frontend
    ports:
      - "5873:80"
    volumes:
    - ./frontend/src:/app/src
    depends_on:
      - api
    networks:
      - internal_net
    restart: unless-stopped

networks:
  internal_net:
    driver: bridge
